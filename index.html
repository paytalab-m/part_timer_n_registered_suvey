<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>시급 2배 챌린지 — 설문</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
<style>
:root{
  --yellow:#FCD20B;--yellow-10:rgba(252,210,11,.10);--yellow-15:rgba(252,210,11,.15);
  --yellow-25:rgba(252,210,11,.25);--yellow-50:rgba(252,210,11,.50);
  --brown:#452614;--brown-80:rgba(69,38,20,.80);--brown-60:rgba(69,38,20,.60);
  --brown-40:rgba(69,38,20,.40);--brown-20:rgba(69,38,20,.20);--brown-10:rgba(69,38,20,.10);
  --brown-06:rgba(69,38,20,.06);--brown-04:rgba(69,38,20,.04);--brown-03:rgba(69,38,20,.03);
  --bg:#F7F6F3;--card:#FFFFFF;--error:#E53935;--error-bg:rgba(229,57,53,.06);--r:16px;--rs:12px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--brown);min-height:100dvh;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
.prog-wrap{position:fixed;top:0;left:0;right:0;height:2px;background:var(--brown-06);z-index:100}
.prog-fill{height:100%;background:var(--yellow);transition:width 1s cubic-bezier(.25,1,.5,1);width:0%}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:center;min-height:52px;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--brown-06)}
.topbar h1{margin:0;font-size:15px;font-weight:700;color:var(--brown);letter-spacing:-.02em}
.ver-toggle{position:fixed;top:60px;right:12px;z-index:60;display:none;gap:4px;background:var(--card);border:1px solid var(--brown-10);border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(69,38,20,.12)}
.vt-btn{border:none;background:transparent;color:var(--brown-40);font-family:inherit;font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;cursor:pointer}
.vt-btn.active{background:var(--brown);color:#fff}
.wrap{max-width:440px;margin:0 auto;padding:24px 20px 140px;min-height:100dvh}
.step{display:none}
.step.active{display:block;animation:fadeUp .4s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border-radius:var(--r);padding:32px 24px;box-shadow:0 1px 3px rgba(69,38,20,.04),0 4px 16px rgba(69,38,20,.02);border:1px solid var(--brown-06)}
/* Intro (미등록 전용) */
#step-intro{text-align:center}
.intro-tag{display:inline-flex;align-items:center;gap:4px;background:var(--yellow-15);color:var(--brown);font-size:12px;font-weight:700;padding:5px 12px;border-radius:20px;margin-bottom:24px}
.intro-card{text-align:center}
.intro-icon{font-size:36px;margin-bottom:20px;display:block}
.intro-title{font-size:22px;font-weight:800;line-height:1.45;letter-spacing:-.04em;margin-bottom:24px}
.intro-title em{font-style:normal;color:var(--brown)}
.intro-desc{font-size:14px;color:var(--brown-80);line-height:1.7;margin-bottom:10px;word-break:keep-all;text-align:left}
.intro-desc:last-of-type{margin-bottom:28px}
.intro-desc strong{color:var(--brown);font-weight:700}
.intro-info-box{background:var(--brown-03);border-radius:var(--rs);margin:0 0 12px 0;overflow:hidden}
.intro-info-toggle{width:100%;background:none;border:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:inherit;font-size:13px;color:var(--brown-60);font-weight:500;text-align:left}
.toggle-arrow{width:14px;height:14px;transition:transform .3s ease;color:var(--brown-40);flex-shrink:0}
.toggle-arrow.open{transform:rotate(90deg)}
.intro-info-content{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;padding:0 16px;font-size:12.5px;color:var(--brown-60);line-height:1.7;word-break:keep-all;text-align:left;font-weight:400}
.intro-info-content.open{max-height:260px;padding:0 16px 14px 16px}
.intro-time{font-size:12px;color:var(--brown-40);margin-top:14px;font-weight:500}
.btn-start{width:100%;padding:18px;font-size:16px;margin-top:12px;border-radius:var(--rs);background:var(--brown);color:#fff}
.q-num{font-size:12px;font-weight:700;color:var(--brown-60);letter-spacing:.04em;margin-bottom:16px}
.q-text{font-size:17px;font-weight:700;line-height:1.6;letter-spacing:-.025em;word-break:keep-all;color:var(--brown)}
.q-hint{font-size:13px;color:var(--brown-60);margin-top:6px;font-weight:400}
.q-gap{height:28px}
.info-block{background:var(--brown-03);border-radius:var(--rs);padding:16px;margin-bottom:16px;font-size:14px;line-height:1.7;color:var(--brown);word-break:keep-all}
.info-block strong{font-weight:700}
.info-img{max-width:100%;border-radius:var(--rs);display:block;margin:0 auto 16px}
.info-code{background:var(--yellow-15);border-radius:var(--rs);padding:14px 16px;margin-bottom:20px;font-size:14px;color:var(--brown);font-weight:600;text-align:center}
.info-code-name{font-size:13px;color:var(--brown-80);font-weight:600;margin-bottom:6px;line-height:1.5;word-break:keep-all}
.info-code-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--brown);font-weight:700}
.info-code .code-val{font-size:18px;font-weight:800;letter-spacing:.05em}
.info-steps{margin:0;padding-left:20px}
.info-steps li{margin-bottom:4px;font-size:14px;line-height:1.7}
.tip-box{background:var(--yellow-15);border:1px solid var(--yellow-25);border-radius:var(--rs);padding:16px;margin-bottom:14px;font-size:14px;line-height:1.7;color:var(--brown);word-break:keep-all}
.tip-box .tip-head{font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tip-box strong{font-weight:800}
.tip-box-list{margin:0;padding:0;list-style:none}
.tip-box-list li{display:flex;gap:8px;margin-bottom:10px;font-size:14px;line-height:1.6}
.tip-box-list li:last-child{margin-bottom:0}
.tip-box-num{flex-shrink:0;font-weight:800;color:var(--brown)}
.inline-tip{display:none;margin-top:18px;padding-top:18px;border-top:1px dashed rgba(69,38,20,.15)}
.inline-tip.show{display:block;animation:inlineFade .25s ease}
.inline-tip-head{font-weight:800;font-size:15px;margin-bottom:10px;color:var(--brown);word-break:keep-all}
@keyframes inlineFade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{position:relative;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt-label{display:flex;align-items:flex-start;gap:14px;padding:18px 16px;border:1.5px solid var(--brown-06);border-radius:var(--rs);font-size:15px;font-weight:400;line-height:1.5;color:var(--brown);transition:all .2s ease;word-break:keep-all;user-select:none;-webkit-user-select:none;background:var(--card)}
.opt-label:active{transform:scale(.985)}
.opt input:checked+.opt-label{border-color:var(--yellow);background:var(--yellow-10);color:var(--brown);font-weight:600;box-shadow:0 0 0 1px var(--yellow-50)}
.ind{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--brown-10);background:var(--brown-03);display:flex;align-items:center;justify-content:center;transition:all .2s ease;margin-top:1px}
.opt input:checked+.opt-label .ind{border-color:var(--yellow);background:var(--yellow);box-shadow:0 1px 4px rgba(252,210,11,.3)}
.opt input:checked+.opt-label .ind::after{content:'';display:block;width:8px;height:8px;border-radius:50%;background:var(--brown)}
.opt-content{flex:1}
.opt-main{font-size:15px;line-height:1.5}
.opt-preview{font-size:12px;color:var(--brown-60);margin-top:6px;line-height:1.5;font-weight:400}
.etc-wrap{display:none;margin-top:8px;animation:fadeUp .25s ease}
.etc-wrap.show{display:block}
.etc-ta,.free-ta{width:100%;padding:14px 16px;border:1.5px solid var(--brown-06);border-radius:var(--rs);font-family:'Pretendard Variable',sans-serif;font-size:14px;resize:none;outline:none;transition:all .2s ease;min-height:76px;background:var(--brown-03);color:var(--brown);line-height:1.6}
.free-ta{font-size:15px;min-height:140px}
.etc-ta::placeholder,.free-ta::placeholder{color:var(--brown-20)}
.etc-ta:focus,.free-ta:focus{border-color:var(--yellow);background:var(--card);box-shadow:0 0 0 3px var(--yellow-25)}
.dt-wrapper{position:relative;width:100%}
.dt-input{width:100%;min-height:56px;padding:16px;border:1.5px solid var(--brown-06);border-radius:var(--rs);font-family:'Pretendard Variable',sans-serif;font-size:16px;outline:none;transition:all .2s ease;background:var(--brown-03);color:var(--brown);-webkit-appearance:none;appearance:none;display:block;box-sizing:border-box;font-weight:500;line-height:1.4;position:relative;z-index:2}
.dt-input:focus{border-color:var(--yellow);background:var(--card);box-shadow:0 0 0 3px var(--yellow-25)}
.dt-input:not(.has-value){color:transparent;-webkit-text-fill-color:transparent}
.dt-input.has-value{color:var(--brown);-webkit-text-fill-color:var(--brown)}
.dt-placeholder{position:absolute;top:50%;left:18px;transform:translateY(-50%);pointer-events:none;color:var(--brown-40);font-size:16px;font-weight:500;letter-spacing:.02em;z-index:1}
.dt-input.has-value ~ .dt-placeholder{display:none}
.dt-hint{font-size:12px;color:var(--brown-40);margin-top:8px;text-align:center;font-weight:500}
.addr-row{display:flex;gap:8px;margin-bottom:10px}
.addr-zip{flex:1;min-height:50px;padding:14px 16px;border:1.5px solid var(--brown-06);border-radius:var(--rs);background:var(--brown-03);color:var(--brown);font-size:15px;font-weight:600;font-family:inherit}
.addr-input{width:100%;min-height:50px;padding:14px 16px;border:1.5px solid var(--brown-06);border-radius:var(--rs);background:var(--brown-03);color:var(--brown);font-size:15px;font-family:inherit;outline:none;margin-bottom:10px}
.addr-input:focus{border-color:var(--yellow);background:var(--card);box-shadow:0 0 0 3px var(--yellow-25)}
.btn-search{flex-shrink:0;padding:0 18px;border:none;border-radius:var(--rs);background:var(--brown);color:#fff;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.btn-search:active{transform:scale(.97)}
.val-msg{display:none;align-items:center;gap:6px;margin-top:20px;padding:12px 14px;background:var(--error-bg);border-radius:10px;font-size:13px;color:var(--error);font-weight:600;animation:shake .35s ease}
.val-msg.show{display:flex}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(247,246,243,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--brown-06);padding:14px 20px;padding-bottom:calc(32px + env(safe-area-inset-bottom));z-index:50;display:none}
.nav-inner{max-width:440px;margin:0 auto;display:flex;gap:10px;align-items:center}
.nav-spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:14px 26px;border-radius:var(--rs);font-family:'Pretendard Variable',sans-serif;font-size:15px;font-weight:700;border:none;cursor:pointer;transition:all .2s ease;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-primary{background:var(--brown);color:#fff}
.btn-ghost{background:transparent;color:var(--brown-40)}
.end-card{text-align:center;padding:52px 24px}
.end-icon{font-size:52px;margin-bottom:20px;display:block}
.end-title{font-size:20px;font-weight:800;margin-bottom:10px;letter-spacing:-.03em}
.end-desc{font-size:14px;color:var(--brown-80);line-height:1.8}
.kakao-card{margin-top:28px;padding:22px 20px;border-radius:var(--rs);background:var(--yellow-10);border:1px solid var(--yellow-25);text-align:center}
.kakao-card-title{font-size:15px;font-weight:800;color:var(--brown);margin-bottom:8px;letter-spacing:-.02em;word-break:keep-all}
.kakao-card-desc{font-size:13px;color:var(--brown-80);line-height:1.7;margin-bottom:16px;word-break:keep-all}
.kakao-card-desc strong{font-weight:700;color:var(--brown)}
.kakao-btn-wrap{display:flex;justify-content:center}
.cs-notice{display:none;margin-top:14px;padding:18px;border-radius:var(--rs);background:var(--brown-04);text-align:center}
.cs-notice.show{display:block}
.cs-notice-title{font-size:13px;font-weight:700;color:var(--brown-60);margin-bottom:6px}
.cs-notice-desc{font-size:12.5px;color:var(--brown-40);line-height:1.6;margin-bottom:12px;word-break:keep-all}
.cs-notice-link{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;background:var(--brown-10);color:var(--brown-80);border-radius:10px;font-size:12.5px;font-weight:700;text-decoration:none}
.cs-notice-link svg{width:13px;height:13px}
</style>
</head>
<body>
<div class="prog-wrap"><div class="prog-fill" id="prog"></div></div>
<header class="topbar"><h1>시급 2배 챌린지</h1></header>
<div class="ver-toggle" id="verToggle">
  <button class="vt-btn" data-v="u" onclick="loadVersion('u')">미등록</button>
  <button class="vt-btn active" data-v="a" onclick="loadVersion('a')">미시작A</button>
  <button class="vt-btn" data-v="b" onclick="loadVersion('b')">미시작B</button>
</div>
<div class="wrap">
  <div class="step" id="step-intro"></div>
  <div id="qWrap"></div>
  <div class="step" id="step-end"><div class="card end-card">
    <span class="end-icon">🎉</span>
    <h2 class="end-title">제출이 완료되었어요!</h2>
    <p class="end-desc">소중한 시간 내어 답변해 주셔서 감사합니다.</p>
    <div class="kakao-card">
      <div class="kakao-card-title">[패스오더 알바지원팀] 채널을 꼭 추가해주세요!</div>
      <div class="kakao-card-desc">영수증 쿠폰 출력 방법, 리워드 안내, 리마인드 메시지는 <strong>카카오톡 채널을 추가하셔야 받을 수 있어요.</strong></div>
      <div class="kakao-btn-wrap">
        <div id="kakao-talk-channel-add-button" data-channel-public-id="_XWxdxhX" data-size="large" data-support-multiple-densities="true"></div>
      </div>
    </div>
    <div class="cs-notice" id="cs-notice">
      <div class="cs-notice-title">더 자세한 도움이 필요하신가요?</div>
      <div class="cs-notice-desc">다른 질문이 있으시면 고객센터로 문의해주세요.</div>
      <a href="https://passorder.kr/template/ptev_survey_customer_center" class="cs-notice-link" target="_blank" rel="noopener">1:1 문의하기<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
    </div>
  </div></div>
</div>
<div class="nav" id="nav"><div class="nav-inner">
  <button class="btn btn-ghost" id="btnPrev" onclick="goPrev()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 이전</button>
  <div class="nav-spacer"></div>
  <button class="btn btn-primary" id="btnNext" onclick="goNext()">다음 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div></div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbysrquaZOgfrKN-tB93ciDupf0Kz0oN3UFSw2QzlqvAycXRtf01EK9Y9LF-qOBBsU4P/exec';

const sid = 'S_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
const p = new URLSearchParams(location.search);
const channel = p.get('channel') || '';
const nickname = p.get('nickname') || '';
const store = p.get('store') || '';
const code = p.get('code') || '';
const phone = p.get('phone') || '';
const previewMode = !p.get('version') && !channel;
function resolveVersion() {
  const vp = (p.get('version') || '').toLowerCase();
  if (vp === 'u' || vp === 'a' || vp === 'b') return vp;
  // 채널 값에 버전 숫자 포함: 2→미시작A, 3→미시작B, 그 외(1·숫자 없음)→미등록(기본)
  if (channel.includes('2')) return 'a';
  if (channel.includes('3')) return 'b';
  return 'u';
}

// ═══════════ 공유: 종료 + 지류쿠폰 + 주소 (미시작 a/b) ═══════════
const SHARED = {
  'QUIT': {
    type: 'info', next: 'END', trigger: '종료처리',
    text: '근무를 종료하셨군요',
    info: `<div class="info-block">알겠습니다. 참여 종료 처리를 도와드릴게요.<br><br>그동안 참여해주셔서 감사합니다. 다음 기회에 또 만나요! 👋</div>`
  },
  'PAPER': {
    num: 'Q2', qid: '지류쿠폰', type: 'radio',
    text: '영수증 쿠폰 대신 종이(지류) 쿠폰을 보내드리면 참여해보시겠어요?',
    info: `<div class="info-block">손님이 영수증 형태라 잘 안 받으시거나 출력이 어려운 경우, 똑같은 혜택의 <strong>종이 쿠폰</strong>을 무료로 보내드릴 수 있어요. 받아서 손님께 나눠주시기만 하면 돼요!</div>`,
    options: [
      { label: '네, 종이 쿠폰으로 받아볼게요', value: '신청', next: 'ADDRESS' },
      { label: '아니요, 괜찮아요', value: '미신청', next: 'END' }
    ]
  },
  'ADDRESS': {
    num: 'Q3', type: 'address', next: 'END',
    text: '종이 쿠폰을 받으실 주소를 알려주세요',
    info: `<div class="info-block">입력해주신 주소로 종이 쿠폰을 보내드릴게요. 📮<br>매장 주소로 받으시면 분실 위험이 커요. 가능하면 <strong>개인 자택 주소</strong>로 작성해주시면 감사하겠습니다. 🙏</div>`
  }
};

// ═══════════ 공유: 전달 funnel (미시작 A/B 공통) ═══════════
const FUNNEL = {
  // ── Q1-2 (공통): 손님 전달 어디서 막혔는지 ──
  'FN-Q': {
    num: 'Q1-2', qid: 'Q1-2', type: 'radio',
    text: '구체적으로 어떤 상황에 가장 가까우세요?',
    options: [
      { label: '출력은 했지만 손님에게 나눠주지는 않았어요', next: 'FN-distribute' },
      { label: '나눠줬지만 손님이 받기를 거절했어요', next: 'FN-reject' },
      { label: '나눠줬지만 손님이 받고 나서 참여하지 않은 것 같아요', next: 'FN-noconvert' },
      { label: '첫 주문 대상 손님한테만 주려다 보니, 줄 손님이 많이 없어요', next: 'FN-giveall' },
      { label: '기타', next: 'CLASSIFY' }
    ]
  },

  // ① 출력은 했지만 안 나눠줌 → 왜 안 나눠줬는지
  'FN-distribute': {
    num: 'Q2', qid: '안나눔이유', type: 'radio',

const CATEGORY_MAP = {
  a: { '깜빡':'A-remind', '번거로움':'A-bulkprint', '안나눔':'FN-distribute', '거절':'FN-reject', '미참여':'FN-noconvert', '대상부족':'FN-giveall', '영수증형태':'PAPER', '근무중단':'QUIT', '기타':'END' },
  b: { '안나눔':'FN-distribute', '거절':'FN-reject', '미참여':'FN-noconvert', '대상부족':'FN-giveall', '영수증형태':'PAPER', '근무중단':'QUIT', '기타':'END' }
};

// ═══════════ 상태 ═══════════
let version = 'a', SURVEY = SURVEYS.a, PAGES = SURVEY.pages;
let answers = {}, history = [], currentPageId = SURVEY.start, needsCS = false;

// ═══════════ 버전 로드 ═══════════
function loadVersion(v) {
  version = (v === 'u' || v === 'b') ? v : 'a';
  SURVEY = SURVEYS[version]; PAGES = SURVEY.pages;
  answers = {}; history = [SURVEY.start]; currentPageId = SURVEY.start; needsCS = false;
  document.getElementById('step-end').classList.remove('active');
  document.getElementById('cs-notice').classList.remove('show');
  document.getElementById('qWrap').innerHTML = '';
  document.getElementById('step-intro').classList.remove('active');
  document.querySelectorAll('.vt-btn').forEach(b => b.classList.toggle('active', b.dataset.v === version));
  saveData('_PAGE_VIEW', location.href);
  if (SURVEY.intro) {
    renderIntro();
    document.getElementById('step-intro').classList.add('active');
    document.getElementById('nav').style.display = 'none';
    scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    document.getElementById('nav').style.display = 'block';
    saveData('_SESSION_START', new Date().toISOString());
    renderPage(currentPageId);
  }
}

(function init() {
  if (previewMode) document.getElementById('verToggle').style.display = 'flex';
  loadVersion(resolveVersion());
})();

function renderIntro() {
  const c = SURVEY.intro;
  let h = `<div class="intro-tag">${c.tag}</div><div class="card intro-card"><span class="intro-icon">${c.icon}</span><h1 class="intro-title">${c.title}</h1>`;
  c.descs.forEach(d => h += `<p class="intro-desc">${d}</p>`);
  if (c.toggle) {
    h += `<div class="intro-info-box"><button class="intro-info-toggle" type="button" onclick="toggleInfo()"><span>${c.toggle.label}</span><svg class="toggle-arrow" id="toggleArrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button><div class="intro-info-content" id="infoContent">${c.toggle.content}</div></div>`;
  }
  h += `<button class="btn btn-start" onclick="startSurvey()">${c.startBtn} <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button><p class="intro-time">${c.time}</p></div>`;
  document.getElementById('step-intro').innerHTML = h;
}
function toggleInfo() { const c = document.getElementById('infoContent'), a = document.getElementById('toggleArrow'); if (c) c.classList.toggle('open'); if (a) a.classList.toggle('open'); }

function startSurvey() {
  document.getElementById('step-intro').classList.remove('active');
  document.getElementById('nav').style.display = 'block';
  history = [SURVEY.start]; currentPageId = SURVEY.start;
  saveData('_SESSION_START', new Date().toISOString());
  renderPage(currentPageId);
}

// ═══════════ 렌더링 ═══════════
function renderPage(pageId) {
  const page = PAGES[pageId];
  if (!page) return;
  const w = document.getElementById('qWrap');
  w.innerHTML = '';
  const d = document.createElement('div');
  d.className = 'step active';

  let h = `<div class="card">`;
  if (page.num) h += `<div class="q-num">${page.num}</div>`;
  h += `<div class="q-text">${page.text.replace(/\n/g, '<br>')}</div>`;
  if (page.hint) h += `<div class="q-hint">${page.hint}</div>`;
  h += `<div class="q-gap"></div>`;
  if (page.info) h += fill(page.info);

  if (page.type === 'radio') {
    h += `<div class="opts">`;
    page.options.forEach((o, i) => {
      const isE = o.label === '기타';
      h += `<div class="opt"><input type="radio" name="${pageId}" id="${pageId}_${i}" value="${o.value || o.label}" data-next="${o.next}" ${isE ? 'data-etc="1"' : ''} onchange="onChg('${pageId}')">`;
      h += `<label class="opt-label" for="${pageId}_${i}"><span class="ind"></span><div class="opt-content"><div class="opt-main">${o.label}</div>`;
      if (o.preview) h += `<div class="opt-preview">${o.preview}</div>`;
      h += `</div></label></div>`;
      if (isE) h += `<div class="etc-wrap" id="${pageId}_ew"><textarea class="etc-ta" id="${pageId}_et" placeholder="직접 입력해 주세요..." oninput="onChg('${pageId}')"></textarea></div>`;
    });
    h += `</div>`;
    h += `<div class="inline-tip" id="${pageId}_tip"></div>`;
  } else if (page.type === 'datetime') {
    const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    const minDt = now.toISOString().slice(0, 16);
    const ex = new Date(); ex.setDate(ex.getDate() + 1);
    const ph = `${ex.getFullYear()}-${String(ex.getMonth() + 1).padStart(2, '0')}-${String(ex.getDate()).padStart(2, '0')}  14:00`;
    h += `<div class="dt-wrapper"><input type="datetime-local" id="${pageId}_dt" class="dt-input" min="${minDt}" oninput="onDtChg(this,'${pageId}')"><div class="dt-placeholder">${ph}</div></div><div class="dt-hint">📅 위를 눌러서 날짜와 시간을 선택해주세요</div>`;
  } else if (page.type === 'address') {
    h += `<div class="addr-row"><input type="text" class="addr-zip" id="${pageId}_zip" placeholder="우편번호" readonly>
      <button type="button" class="btn-search" onclick="openPostcode('${pageId}')">주소 검색</button></div>
      <input type="text" class="addr-input" id="${pageId}_addr" placeholder="도로명/지번 주소" readonly>
      <input type="text" class="addr-input" id="${pageId}_detail" placeholder="상세주소 (동·호수 등)" oninput="onChg('${pageId}')">`;
  } else if (page.type === 'freetext') {
    h += `<textarea class="free-ta" id="${pageId}_t" placeholder="자유롭게 적어주세요..." oninput="onChg('${pageId}')"></textarea>`;
  }

  h += `<div class="val-msg" id="val_${pageId}">⚠️ 답변을 선택해 주세요</div></div>`;
  d.innerHTML = h;
  w.appendChild(d);
  restoreAns(pageId);
  document.getElementById('btnPrev').style.display = (history.length <= 1) ? 'none' : '';
  if (page.type === 'radio') syncRadioUI(pageId); else updateBtn(page);
  updateProg();
  scrollTo({ top: 0, behavior: 'smooth' });
}

function fill(s) { return s.replace(/\{\{code\}\}/g, code || '확인 필요').replace(/\{\{nickname\}\}/g, nickname || '').replace(/\{\{store\}\}/g, store || ''); }

function restoreAns(pageId) {
  const a = answers[pageId], page = PAGES[pageId];
  if (a == null) return;
  if (page.type === 'radio') {
    document.querySelectorAll(`input[name="${pageId}"]`).forEach(r => {
      if (r.value === a) { r.checked = true;
        if (r.dataset.etc && answers[pageId + '_etc']) {
          const ew = document.getElementById(pageId + '_ew'); if (ew) ew.classList.add('show');
          const et = document.getElementById(pageId + '_et'); if (et) et.value = answers[pageId + '_etc'];
        }
      }
    });
  } else if (page.type === 'datetime') {
    const dt = document.getElementById(pageId + '_dt'); if (dt) { dt.value = a; if (a) dt.classList.add('has-value'); }
  } else if (page.type === 'address') {
    if (answers[pageId + '_zip']) document.getElementById(pageId + '_zip').value = answers[pageId + '_zip'];
    if (answers[pageId + '_addr']) document.getElementById(pageId + '_addr').value = answers[pageId + '_addr'];
    if (a) document.getElementById(pageId + '_detail').value = a;
  } else if (page.type === 'freetext') {
    const t = document.getElementById(pageId + '_t'); if (t) t.value = a;
  }
}

function isInlineTip(nx) {
  const p = PAGES[nx];
  return !!(p && p.type === 'info' && (p.next === 'END' || !p.next));
}

function syncRadioUI(pageId) {
  const page = PAGES[pageId];
  if (!page || page.type !== 'radio') return;
  const ec = document.querySelector(`input[name="${pageId}"][data-etc="1"]`);
  if (ec) { const ew = document.getElementById(pageId + '_ew'); ec.checked ? ew.classList.add('show') : ew.classList.remove('show'); }
  const checked = document.querySelector(`input[name="${pageId}"]:checked`);
  const tipEl = document.getElementById(pageId + '_tip');
  if (!checked) { if (tipEl) { tipEl.classList.remove('show'); tipEl.innerHTML = ''; } setNextLabel('다음'); return; }
  const nx = checked.dataset.next;
  if (isInlineTip(nx)) {
    const tip = PAGES[nx];
    if (tipEl) { tipEl.innerHTML = `<div class="inline-tip-head">${tip.text || ''}</div>` + fill(tip.info || ''); tipEl.classList.add('show'); }
    setNextLabel('END');
  } else {
    if (tipEl) { tipEl.classList.remove('show'); tipEl.innerHTML = ''; }
    setNextLabel(nx);
  }
}

// 선지 변경 시 디바운스 즉시 저장 (제출 전 이탈해도 마지막 선택 보존 / last-write-wins)
let saveTimer = null;
function scheduleSave(pageId) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => immediateSave(pageId), 500);
}
function immediateSave(pageId) {
  const page = PAGES[pageId];
  if (!page || !page.qid) return;
  const a = getAns(pageId);
  if (a == null || a === '') return;
  answers[pageId] = a;
  saveData(page.qid, a, answers[pageId + '_etc']);
}

function onChg(pageId) {
  if (PAGES[pageId].type === 'radio') syncRadioUI(pageId);
  const v = document.getElementById('val_' + pageId); if (v) v.classList.remove('show');
  scheduleSave(pageId);
}
function onDtChg(el, pageId) { el.value ? el.classList.add('has-value') : el.classList.remove('has-value'); onChg(pageId); }

function openPostcode(pageId) {
  if (typeof daum === 'undefined' || !daum.Postcode) { alert('주소 검색을 불러오지 못했어요. 잠시 후 다시 시도해주세요.'); return; }
  new daum.Postcode({ oncomplete: function (data) {
    document.getElementById(pageId + '_zip').value = data.zonecode;
    document.getElementById(pageId + '_addr').value = data.roadAddress || data.jibunAddress;
    document.getElementById(pageId + '_detail').focus();
    onChg(pageId);
  }}).open();
}

function setNextLabel(nextId) {
  const btn = document.getElementById('btnNext');
  if (nextId === 'END') btn.innerHTML = `제출 완료 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>`;
  else if (nextId === 'CLASSIFY') btn.innerHTML = `해결 방법 찾기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
  else btn.innerHTML = `다음 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`;
}

function getAns(pageId) {
  const page = PAGES[pageId];
  if (page.type === 'radio') {
    const c = document.querySelector(`input[name="${pageId}"]:checked`); if (!c) return null;
    const ec = document.querySelector(`input[name="${pageId}"][data-etc="1"]:checked`);
    if (ec) { const t = document.getElementById(pageId + '_et'); if (t) answers[pageId + '_etc'] = t.value; }
    else delete answers[pageId + '_etc'];
    return c.value;
  }
  if (page.type === 'datetime') { const dt = document.getElementById(pageId + '_dt'); return dt ? dt.value : null; }
  if (page.type === 'address') {
    const zip = document.getElementById(pageId + '_zip').value;
    const addr = document.getElementById(pageId + '_addr').value;
    const detail = document.getElementById(pageId + '_detail').value;
    answers[pageId + '_zip'] = zip; answers[pageId + '_addr'] = addr;
    return detail;
  }
  if (page.type === 'freetext') { const t = document.getElementById(pageId + '_t'); return t ? t.value : null; }
  if (page.type === 'info') return 'Y';
  return null;
}

function valPage(pageId) {
  const page = PAGES[pageId];
  if (page.type === 'info') return true;
  const a = getAns(pageId);
  const v = document.getElementById('val_' + pageId);
  if (page.type === 'address') {
    if (!answers[pageId + '_addr']) { v.innerHTML = '⚠️ 주소를 검색해 주세요'; v.classList.add('show'); return false; }
    if (!a || !a.trim()) { v.innerHTML = '⚠️ 상세주소를 입력해 주세요'; v.classList.add('show'); return false; }
    return true;
  }
  if (!a) {
    if (page.type === 'datetime') v.innerHTML = '⚠️ 날짜와 시간을 입력해 주세요';
    else if (page.type === 'freetext') v.innerHTML = '⚠️ 답변을 입력해 주세요';
    else v.innerHTML = '⚠️ 답변을 선택해 주세요';
    v.classList.add('show'); return false;
  }
  if (page.type === 'radio' && a === '기타') {
    const t = document.getElementById(pageId + '_et');
    if (t && !t.value.trim()) { v.innerHTML = '⚠️ 기타 항목을 입력해 주세요'; v.classList.add('show'); return false; }
  }
  return true;
}

function getNextPageId(pageId) {
  const page = PAGES[pageId];
  if (page.type === 'radio') { const c = document.querySelector(`input[name="${pageId}"]:checked`); return c ? c.dataset.next : null; }
  return page.next || null;
}

// ═══════════ 네비게이션 ═══════════
async function goNext() {
  if (!valPage(currentPageId)) return;
  const page = PAGES[currentPageId];
  const a = getAns(currentPageId);
  answers[currentPageId] = a;

  if (page.qid) saveData(page.qid, a, answers[currentPageId + '_etc']);
  if (page.type === 'address') {
    saveData('우편번호', answers[currentPageId + '_zip']);
    saveData('도로명주소', answers[currentPageId + '_addr']);
    saveData('상세주소', a);
    saveData('지류쿠폰', '신청');
  }
  if (page.triggerCRM) saveData('점주CRM', 'Y');
  if (page.trigger) saveData(page.trigger, 'Y');
  if (page.type === 'radio') {
    const checked = document.querySelector(`input[name="${currentPageId}"]:checked`);
    if (checked) {
      const opt = page.options.find(o => (o.value || o.label) === checked.value);
      if (opt) { if (opt.trigger) saveData(opt.trigger, 'Y'); if (opt.needsCS) needsCS = true; }
    }
  }

  let nextId = getNextPageId(currentPageId);
  const directNext = nextId;

  if (nextId === 'CLASSIFY') {
    const etc = answers[currentPageId + '_etc'] || '';
    const btn = document.getElementById('btnNext');
    btn.disabled = true; btn.innerHTML = '분석 중...';
    const category = await classifyEtc(etc);
    btn.disabled = false;
    saveData('AI분류', category);
    nextId = (CATEGORY_MAP[version] && CATEGORY_MAP[version][category]) || 'END';
  }

  // 인라인 꿀팁으로 이미 보여준 종착 선지: 별도 페이지 없이 바로 제출 (트리거만 발화)
  if (directNext === nextId && isInlineTip(nextId)) {
    const tip = PAGES[nextId];
    if (tip.qid) saveData(tip.qid, 'Y');
    if (tip.triggerCRM) saveData('점주CRM', 'Y');
    if (tip.trigger) saveData(tip.trigger, 'Y');
    nextId = 'END';
  }

  if (nextId === 'END' || !nextId) { showEnd(); return; }
  currentPageId = nextId;
  history.push(currentPageId);
  renderPage(currentPageId);
}

function goPrev() {
  if (history.length <= 1) {
    if (SURVEY.intro) {
      document.getElementById('qWrap').innerHTML = '';
      document.getElementById('nav').style.display = 'none';
      document.getElementById('step-intro').classList.add('active');
    }
    return;
  }
  history.pop();
  currentPageId = history[history.length - 1];
  renderPage(currentPageId);
}

function showEnd() {
  document.getElementById('qWrap').innerHTML = '';
  document.getElementById('step-end').classList.add('active');
  document.getElementById('nav').style.display = 'none';
  document.getElementById('prog').style.width = '100%';
  document.getElementById('cs-notice').classList.add('show');
  saveData('_SESSION_END', new Date().toISOString());
  scrollTo({ top: 0, behavior: 'smooth' });
}

function updateBtn(page) {
  if (page.type === 'info' || page.next === 'END') setNextLabel('END');
  else setNextLabel('다음');
}
function updateProg() { document.getElementById('prog').style.width = Math.min((history.length / 5) * 100, 95) + '%'; }

// ═══════════ 기타 분류 (AI 우선, 키워드 폴백) ═══════════
async function classifyEtc(text) {
  if (!text || !text.trim()) return '기타';
  if (APPS_SCRIPT_URL) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 6000);
      const url = APPS_SCRIPT_URL + '?action=classify&version=' + encodeURIComponent(version) + '&text=' + encodeURIComponent(text);
      const r = await fetch(url, { signal: ctrl.signal });
      clearTimeout(timer);
      const j = await r.json();
      if (j && j.category) return j.category;
    } catch (e) {}
  }
  return keywordClassify(text);
}

function keywordClassify(t) {
  const s = t.toLowerCase();
  const has = (...ks) => ks.some(k => s.includes(k));
  if (has('영수증') && has('안 받', '안받', '거절', '싫어', '안 가져', '안가져')) return '영수증형태';
  if (has('종이', '지류', '용지', '용지값', '종이값', '눈치')) return '영수증형태';
  if (version === 'a') {
    if (has('까먹', '잊', '깜빡')) return '깜빡';
    if (has('귀찮', '번거', '매번', '바빠')) return '번거로움';
    if (has('안 나눠', '안나눠', '못 나눠', '못나눠', '안 줬', '안줬')) return '안나눔';
    if (has('거절', '안 받', '안받')) return '거절';
    if (has('주문', '참여', '안 해', '안해')) return '미참여';
    if (has('첫 주문', '대상', '단골', '이미 쓰', '손님이 적', '손님 없')) return '대상부족';
    if (has('그만', '퇴사', '관둠', '관뒀', '그만뒀', '근무 안', '근무안')) return '근무중단';
    return '기타';
  } else {
    if (has('안 나눠', '안나눠', '못 나눠', '못나눠', '안 줬', '안줬')) return '안나눔';
    if (has('거절', '안 받', '안받', '싫다')) return '거절';
    if (has('주문', '참여', '안 해', '안해')) return '미참여';
    if (has('첫 주문', '대상', '단골', '이미 쓰', '손님이 적', '손님 없')) return '대상부족';
    if (has('그만', '퇴사', '관둠', '관뒀', '그만뒀', '근무 안', '근무안')) return '근무중단';
    return '기타';
  }
}

// ═══════════ 저장 (fire-and-forget) ═══════════
function saveData(qid, answer, etcText) {
  if (!APPS_SCRIPT_URL) return;
  const payload = {
    sessionId: sid, version, channel, nickname, store, code, phone,
    questionId: qid,
    answer: Array.isArray(answer) ? answer.join(', ') : (answer || ''),
    etcText: etcText || '',
    timestamp: new Date().toISOString()
  };
  try {
    const data = JSON.stringify(payload);
    if (navigator.sendBeacon) {
      const ok = navigator.sendBeacon(APPS_SCRIPT_URL, new Blob([data], { type: 'text/plain;charset=utf-8' }));
      if (ok) return;
    }
    fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: data, keepalive: true });
  } catch (e) {}
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    if (document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.type === 'datetime-local' || document.activeElement.classList.contains('addr-input'))) return;
    if (document.getElementById('nav').style.display !== 'none') { e.preventDefault(); goNext(); }
  }
});
